<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html">APESCO<small>Arua Public Secondary School</small></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="academics.html">Academics</a>
      <a href="admissions.html">Admissions</a>
      <a href="news.html">News</a>
      <a href="contact.html" class="on">Contact</a>
      <a class="btn" href="login.html">Portal login</a>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <h1>Contact us</h1>
  </div>
</div>
<main>
  <section>
    <div class="wrap">
      <h2>Get in touch</h2>
      <p>Arua, Uganda</p>
      <div class="contact-layout">
      <div>
      <div class="contact-links contact-cards" aria-label="Contact options">
        <a class="contact-link contact-card" href="tel:0393101914">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.19 18a19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.09 3.18 2 2 0 0 1 4.08 1h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.06 8.94a16 16 0 0 0 6 6l1.31-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92Z"/>
            </svg>
          </span>
          <span class="contact-link-text">
            <span>Phone</span>
            <strong>0393101914</strong>
          </span>
        </a>
        <a class="contact-link contact-card" href="mailto:aruapublicsecondary@gmail.com">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>
          <span class="contact-link-text">
            <span>Gmail</span>
            <strong>aruapublicsecondary@gmail.com</strong>
          </span>
        </a>
        <a
          class="contact-link contact-card"
          href="http://www.aruapublicsecondary.edu.ug"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/>
            </svg>
          </span>
          <span class="contact-link-text">
            <span>Website</span>
            <strong>aruapublicsecondary.edu.ug</strong>
          </span>
        </a>
      </div>
      </div>
      <form data-demo>
        <label>Your name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Message<textarea name="message" rows="5" maxlength="600" required></textarea></label>
        <span class="character-count" aria-live="polite">0 / 600</span>
        <button class="btn" type="submit">Send message</button>
      </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">&copy; 2026 Arua Public Secondary School (APESCO). Arua, Uganda.</div>
</footer>
<script src="js/api.js"></script>
<script src="app.js"></script>
</body>
</html>
